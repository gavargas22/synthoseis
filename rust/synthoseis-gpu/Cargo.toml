[package]
name = "synthoseis-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Per-tile Zoeppritz + wavelet fuse kernels (CPU software + optional wgpu/WGSL)."

[features]
default = ["wgpu"]
# wgpu 24 compute path. Disable with --no-default-features for lean builds.
# MSRV note: the `wgpu` 24 crate follows wgpu's "rest of workspace" MSRV of
# Rust 1.83 (only naga / wgpu-core / wgpu-hal / wgpu-types are 1.76), so the
# workspace declares rust-version 1.83; CI has an MSRV job (1.83) plus stable.
# Graceful no-adapter fallback keeps ubuntu-latest green.
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
synthoseis-seismic.workspace = true
wgpu = { version = "24.0", optional = true, default-features = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
synthoseis-seismic.workspace = true
