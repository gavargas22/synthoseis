name: maturin-bindings

on:
  push:
    paths:
      - "rust/**"
      - "tests/test_mdio_bindings.py"
      - "pyproject.toml"
      - ".github/workflows/maturin-bindings.yml"
  pull_request:
    paths:
      - "rust/**"
      - "tests/test_mdio_bindings.py"
      - "pyproject.toml"
      - ".github/workflows/maturin-bindings.yml"

jobs:
  mdio-python-extension:
    name: maturin build + MDIO binding test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python so pyo3-ffi / extension builds see 3.12. ubuntu-latest (26.04)
      # defaults to 3.14, which pyo3 0.23.5 rejects (max 3.13). Matches nightlies.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Resolve + sync Python deps
        run: |
          uv lock
          uv sync --group dev

      - name: Install maturin
        run: uv pip install maturin

      - name: Build + install synthoseis_mdio extension
        run: uv run maturin develop --manifest-path rust/synthoseis-py/Cargo.toml

      - name: Binding round-trip pytest
        run: uv run pytest tests/test_mdio_bindings.py -q
