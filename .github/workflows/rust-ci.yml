name: rust-ci

on:
  push:
    paths:
      - "rust/**"
      - "tests/fixtures/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "tests/fixtures/**"
      - ".github/workflows/rust-ci.yml"

jobs:
  check-and-test:
    name: cargo check + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace
      - name: synthoseis-gpu without wgpu feature
        run: cargo test -p synthoseis-gpu --no-default-features
      - name: synthoseis-gpu with wgpu feature
        run: cargo test -p synthoseis-gpu --features wgpu
      - name: e2e tiny-cube smoke
        run: cargo run -p synthoseis -- run --e2e --store /tmp/synthoseis-e2e.mdio
      - name: multi-worker partition smoke
        run: cargo run -p synthoseis -- run --workers 4 --partition-plan /tmp/synthoseis-plan.json
      - name: chunked e2e smoke
        run: cargo run -p synthoseis -- run --e2e --chunked --chunk-i 4 --chunk-j 4 --store /tmp/synthoseis-e2e-chunked.mdio
      - name: strip-stitch multi-worker e2e smoke
        run: cargo run -p synthoseis -- run --e2e --chunked --workers 4 --chunk-i 2 --chunk-j 4 --store /tmp/synthoseis-e2e-strip.mdio
      - name: multiprocess JobPartitionPlan e2e smoke
        run: cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 4 --chunk-i 2 --chunk-j 4 --store /tmp/synthoseis-e2e-mp.mdio
      - name: geometry-once seismic-many angles smoke
        run: cargo run -p synthoseis -- run --e2e --chunked --angles 0,15,30 --store /tmp/geo.mdio
      - name: gpu tile fuse smoke (CPU fallback or WGSL when adapter)
        run: cargo run -p synthoseis -- run --e2e --chunked --gpu --store /tmp/gpu.mdio
      - name: faults e2e smoke (fault_labels written)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 4 --seed 4 --shape 48,48,64 --store /tmp/faults.mdio && test -f /tmp/faults.mdio/data/fault_labels/.zarray
      - name: seismic filters e2e smoke (bandpass + lateral, non-dividing chunks)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --chunk-i 5 --chunk-j 7 --bandpass 4,30 --lateral-filter 3 --store /tmp/filters.mdio
      - name: seismic filters keep-ricker + gpu skip smoke
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --chunk-i 5 --chunk-j 7 --bandpass 4,30 --keep-ricker --store /tmp/filters-keep.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,64 --bandpass 4,30 --store /tmp/filters-gpu.mdio
      - name: seismic noise smoke (bandpass + lateral + noise, cpu and gpu)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --chunk-i 5 --chunk-j 7 --bandpass 4,30 --lateral-filter 3 --noise-snr-db 12.5 --noise-seed 7 --store /tmp/noise.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,64 --noise-snr-db 12.5 --noise-legacy-seabed --store /tmp/noise-gpu.mdio
      - name: rock physics smoke (default, legacy switch, backus + gpu, multiprocess)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --chunk-i 5 --chunk-j 7 --store /tmp/rp.mdio && cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --legacy-toy-depth --store /tmp/rp-legacy.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --mixing backus --first-random-layer 0 --shape 24,20,64 --store /tmp/rp-backus-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --mixing backus --store /tmp/rp-mp.mdio
      - name: zoeppritz smoke (textbook default, --legacy-zoeppritz cpu + gpu + multiprocess)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 24,20,64 --legacy-zoeppritz --store /tmp/zl.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,64 --legacy-zoeppritz --store /tmp/zl-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,64 --store /tmp/zx-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --legacy-zoeppritz --store /tmp/zl-mp.mdio
      - name: toy geometry smoke (layered default + planar, single + multiprocess + gpu)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 32,32,192 --store /tmp/tl.mdio && cargo run -p synthoseis -- run --e2e --chunked --toy-geometry planar --shape 24,20,64 --store /tmp/tp.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --toy-geometry layered --store /tmp/tl-mp.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,160 --store /tmp/tl-gpu.mdio
      - name: toy lithology smoke (markov default, fixed fraction + gpu, alternating, multiprocess)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 32,32,192 --store /tmp/lm.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,160 --sand-layer-fraction 0.4 --sand-layer-thickness 3 --store /tmp/lm-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --shape 24,20,64 --toy-lithology alternating --store /tmp/la.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --sand-layer-fraction 0.5 --store /tmp/lm-mp.mdio
      - name: closures per sand unit smoke (default, --closures-per-layer, gpu, multiprocess)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 32,32,128 --sand-layer-fraction 0.5 --sand-layer-thickness 3 --store /tmp/cu.mdio && cargo run -p synthoseis -- run --e2e --chunked --faults 3 --shape 32,32,128 --sand-layer-fraction 0.5 --sand-layer-thickness 3 --closures-per-layer --store /tmp/cl.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --shape 24,20,128 --sand-layer-fraction 0.4 --sand-layer-thickness 3 --store /tmp/cu-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --closures-per-layer --store /tmp/cl-mp.mdio
      - name: closure segmentation across faults smoke (default, --closures-unsegmented, gpu, multiprocess)
        run: cargo run -p synthoseis -- run --e2e --chunked --faults 4 --seed 7 --shape 32,32,128 --sand-layer-fraction 0.5 --sand-layer-thickness 1 --store /tmp/cs.mdio && cargo run -p synthoseis -- run --e2e --chunked --faults 4 --seed 7 --shape 32,32,128 --sand-layer-fraction 0.5 --sand-layer-thickness 1 --closures-unsegmented --store /tmp/cs-un.mdio && cargo run -p synthoseis -- run --e2e --chunked --gpu --faults 4 --seed 7 --shape 24,20,128 --sand-layer-fraction 0.5 --sand-layer-thickness 1 --store /tmp/cs-gpu.mdio && cargo run -p synthoseis -- run --e2e --chunked --multiprocess --workers 3 --chunk-i 2 --chunk-j 4 --closures-unsegmented --store /tmp/cs-mp.mdio

  msrv:
    name: MSRV (Rust 1.83)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Stable cargo (>= 1.84) provides the MSRV-aware resolver; Cargo.lock is
      # not committed, so resolve deps against rust-version (1.83) first.
      - name: Install stable Rust (resolver)
        uses: dtolnay/rust-toolchain@stable
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.83
      - name: MSRV-aware lockfile
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: cargo check (1.83)
        run: cargo +1.83 check --workspace --all-targets --locked
      - name: cargo test (1.83)
        run: cargo +1.83 test --workspace --locked
