name: nightly-msrv

# Full test suite on the MSRV toolchain (Rust 1.83). Pull requests only run
# `cargo +1.83 check --all-targets` (rust-ci.yml). The test profile stays a
# debug-assertion, overflow-checked build; only the optimisation level is
# raised.
on:
  schedule:
    # 08:47 UTC = 03:47 CDT / 02:47 CST (30 min after nightly.yml).
    - cron: "47 8 * * *"
  workflow_dispatch:

jobs:
  msrv-tests:
    name: MSRV tests (Rust 1.83)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Stable cargo (>= 1.84) provides the MSRV-aware resolver; Cargo.lock is
      # not committed, so resolve deps against rust-version (1.83) first.
      - name: Install stable Rust (resolver)
        uses: dtolnay/rust-toolchain@stable
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.83
      - name: MSRV-aware lockfile
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: cargo test (1.83)
        run: cargo +1.83 test --workspace --locked
