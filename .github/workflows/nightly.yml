name: nightly

# Slow sweeps and wall-clock checks, kept out of the per-PR run. Tests that
# run here are tagged `#[ignore = "nightly: ..."]` (no test is ignored for
# any other reason). The test profile stays a debug-assertion,
# overflow-checked build; only the optimisation level is raised.
on:
  schedule:
    # 08:17 UTC = 03:17 CDT / 02:17 CST.
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  ignored-tests:
    name: nightly tests (cargo test -- --ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # Pin Python so pyo3-ffi sees 3.12. ubuntu-latest (26.04) defaults to
      # 3.14, which pyo3 0.23.5 rejects (max 3.13). Matches ci.yml's 3.12 pin.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test -- --ignored
        run: cargo test --workspace --no-fail-fast -- --ignored
