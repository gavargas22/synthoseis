name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff (syntax / critical only)
        # Omit F82 for now: many intentional UnboundLocalError patterns
        # are flagged as F821 (e.g. Horizons depth_maps bootstrap).
        # Full F821/ruff cleanup is a follow-up, not this hygiene PR.
        run: uv run ruff check . --select E9,F63,F7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Pytest (exclude slow)
        run: uv run pytest -m "not slow" -q
