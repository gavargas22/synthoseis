name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Ruff (critical rules only)
        # Full-repo ruff is red on pre-existing F401/F841/E722/etc.
        # Keep hygiene CI green; file full cleanup as a follow-up.
        run: uv run ruff check . --select E9,F63,F7,F82

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Pytest (exclude slow)
        run: uv run pytest -m "not slow" -q
